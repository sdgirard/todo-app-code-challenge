# nginx config for the frontend SPA image (docker/Dockerfile.app).
# Design decisions and rationale: docs/infra/container-image-frontend.md.

server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /certs/todo-app.crt;
    ssl_certificate_key /certs/todo-app.key;

    root /usr/share/nginx/html;
    index index.html;

    # version.json is regenerated per build (see Dockerfile) and must never be
    # served stale from a browser/proxy cache the way hashed assets are.
    location = /version.json {
        add_header Cache-Control "no-store";
    }

    # Vite fingerprints these filenames with a content hash, so they're safe
    # to cache aggressively — a new build always ships a new URL.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA fallback: any path that isn't a real static file resolves to
    # index.html so React Router's client-side routes work on a hard
    # refresh/direct link, not just client-side navigation.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
