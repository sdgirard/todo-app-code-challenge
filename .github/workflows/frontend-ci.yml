name: Frontend CI

on:
  push:
    branches: [main]
    paths: ["frontend/**", "docker/Dockerfile.app", "docker/nginx.conf", "docker/docker-entrypoint.sh", "docker/env-config.js.template"]
  pull_request:
    branches: [main]
    paths: ["frontend/**", "docker/Dockerfile.app", "docker/nginx.conf", "docker/docker-entrypoint.sh", "docker/env-config.js.template"]

env:
  HARBOR_REGISTRY: docker.thecameraeye.ca
  HARBOR_PROJECT: todo-app
  IMAGE: todo-app-web

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test -- --run

  # Build+push only runs for a real push to main, not PRs — mirrors
  # backend-ci.yml's build-and-push job. This service generates and tags its
  # own version independently of the backend's — see
  # docs/infra/versioning.md#per-service-patch-sequences.
  build-and-push:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history needed to find existing version tags

      - name: Generate version
        id: version
        run: sh scripts/generate-version.sh web

      - name: Record build date
        id: build-date
        run: echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Log in to Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ env.HARBOR_REGISTRY }}
          username: ${{ secrets.HARBOR_ROBOT_USERNAME }}
          password: ${{ secrets.HARBOR_ROBOT_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.app
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
            APP_COMMIT_SHA=${{ github.sha }}
            APP_BUILD_DATE=${{ steps.build-date.outputs.date }}
          tags: |
            ${{ env.HARBOR_REGISTRY }}/${{ env.HARBOR_PROJECT }}/${{ env.IMAGE }}:latest
            ${{ env.HARBOR_REGISTRY }}/${{ env.HARBOR_PROJECT }}/${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.HARBOR_REGISTRY }}/${{ env.HARBOR_PROJECT }}/${{ env.IMAGE }}:${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ env.IMAGE }}
          cache-to: type=gha,mode=max,scope=${{ env.IMAGE }}

      - name: Create and push git tag
        run: |
          GIT_TAG="${{ steps.version.outputs.git_tag }}"
          echo "==> Creating Git tag: $GIT_TAG"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git tag -a "$GIT_TAG" -m "Release $GIT_TAG

          Commit: ${{ github.sha }}
          Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          git push origin "$GIT_TAG"
