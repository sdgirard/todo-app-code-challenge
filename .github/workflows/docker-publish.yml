name: Build and Push to Harbor

on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  HARBOR_REGISTRY: docker.thecameraeye.ca
  HARBOR_PROJECT: todo-app

jobs:
  backend-ci:
    uses: ./.github/workflows/backend-ci.yml

  version:
    needs: backend-ci
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.generate.outputs.version }}
      build-date: ${{ steps.build-date.outputs.date }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history needed to find existing version tags

      - name: Generate version
        id: generate
        run: sh scripts/generate-version.sh

      - name: Record build date
        id: build-date
        run: echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

  build-and-push:
    needs: version
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: todo-app-gateway
            dockerfile: docker/Dockerfile.gateway
            # .NET version-stamping args — see docs/infra/versioning.md and
            # VersionEndpoint.cs (GET /version). Not applicable to
            # docker/Dockerfile.app once it exists (different toolchain).
            build_args: |
              APP_VERSION=${{ needs.version.outputs.version }}
              APP_COMMIT_SHA=${{ github.sha }}
              APP_BUILD_DATE=${{ needs.version.outputs.build-date }}
          # - image: todo-app-web
          #   dockerfile: docker/Dockerfile.app
          #   build_args: ""
          # Uncomment once frontend/ and docker/Dockerfile.app exist — see
          # docs/infra/dockerfile-organization.md.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ env.HARBOR_REGISTRY }}
          username: ${{ secrets.HARBOR_ROBOT_USERNAME }}
          password: ${{ secrets.HARBOR_ROBOT_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: ${{ matrix.build_args }}
          tags: |
            ${{ env.HARBOR_REGISTRY }}/${{ env.HARBOR_PROJECT }}/${{ matrix.image }}:latest
            ${{ env.HARBOR_REGISTRY }}/${{ env.HARBOR_PROJECT }}/${{ matrix.image }}:${{ github.sha }}
            ${{ env.HARBOR_REGISTRY }}/${{ env.HARBOR_PROJECT }}/${{ matrix.image }}:${{ needs.version.outputs.version }}
          labels: |
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  version-tag:
    needs: [version, build-and-push]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create and push git tag
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          echo "==> Creating Git tag: $VERSION"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git tag -a "$VERSION" -m "Release $VERSION

          Commit: ${{ github.sha }}
          Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          git push origin "$VERSION"
