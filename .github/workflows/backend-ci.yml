name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call: {}

defaults:
  run:
    working-directory: backend

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore TodoApi.slnx

      - name: Build
        run: dotnet build TodoApi.slnx --no-restore --configuration Release

      # Runs both unit tests (TodoApi.Todos.Tests) and integration tests
      # (TodoApi.Gateway.Tests) — see CLAUDE.md's Test command. Targeting the
      # solution explicitly, not a bare `dotnet test`, so both projects run.
      - name: Test
        run: dotnet test TodoApi.slnx --no-build --configuration Release
